name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build universal .app
        run: bash scripts/build-mac.sh

      - name: Package zip
        run: cd dist/mac && zip -r -q -X ../CrossScreen-macos-universal.zip CrossScreen.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossScreen-macos-universal.zip
          path: dist/CrossScreen-macos-universal.zip

  build-windows:
    name: Build Windows (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H=windowsgui -s -w" -o CrossScreen-windows-amd64.exe ./cmd/crossscreen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossScreen-windows-amd64.exe
          path: CrossScreen-windows-amd64.exe

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
